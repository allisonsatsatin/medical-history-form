<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical History Dashboard</title>
  <link rel="stylesheet" href="styles/home.css">
  <script src="scripts/home.js" defer></script>
</head>
<body>

  <div class="banner">
    <h1>Thank you for submitting!</h1>
  </div>

  <div class="record">
    <h2>Patient Information</h2>
    <p><strong>Name:</strong> <span id="patientName"></span></p>
    <p><strong>Age:</strong> <span id="patientAge"></span></p>
    <p><strong>Birthdate:</strong> <span id="patientBirthdate"></span></p>
    <p><strong>Gender:</strong> <span id="patientGender"></span></p>
    <p><strong>Marital Status:</strong> <span id="patientStatus"></span></p>
    <p><strong>Contact:</strong> <span id="patientContact"></span></p>
    <p><strong>Email:</strong> <span id="patientEmail"></span></p>

    <h2>Medical Conditions</h2>
    <p><strong>Conditions:</strong> <span id="patientConditions"></span></p>
    <p><strong>Other Conditions:</strong> <span id="patientConditionOthers"></span></p>

    <h2>Symptoms</h2>
    <p><strong>Symptoms:</strong> <span id="patientSymptoms"></span></p>
    <p><strong>Other Symptoms:</strong> <span id="patientSymptomOthers"></span></p>
  </div>

</body>
</html>
